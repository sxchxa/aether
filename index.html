<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether</title>
    <style>
      /* Écran de chargement : affiché immédiatement, avant le chargement de l'application.
         Toutes les animations utilisent transform / opacity (fluides même pendant le préchargement). */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0c0c0e;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 50% at 50% 45%, #10141b 0%, #07080a 72%);
        transition:
          opacity 480ms cubic-bezier(0.2, 0, 0, 1),
          visibility 480ms;
      }
      #splash.hide {
        opacity: 0;
        visibility: hidden;
      }
      #splash .wrap {
        display: grid;
        justify-items: center;
        gap: 40px;
      }
      #splash .logo {
        position: relative;
        width: 160px;
        height: 160px;
        /* Visible dès la toute première image : aucune animation d'apparition (elle attendrait
           la fin du chargement du code de l'application pour démarrer). */
        transition: transform 480ms cubic-bezier(0.2, 0, 0, 1);
      }
      #splash.hide .logo {
        transform: scale(1.04);
      }
      #splash .logo svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Reflet masqué à la forme du A : seul le reflet se déplace (transform). */
      #splash .shine {
        position: absolute;
        inset: 0;
        overflow: hidden;
        -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path d='M222 806L512 236L802 806' fill='none' stroke='black' stroke-width='124' stroke-linecap='round' stroke-linejoin='round'/><path d='M206 784C276 668 420 612 572 618C626 620 638 650 612 670C510 716 384 764 302 818C288 830 276 841 266 850L222 806Z'/></svg>")
          0 0 / 100% 100% no-repeat;
        mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'><path d='M222 806L512 236L802 806' fill='none' stroke='black' stroke-width='124' stroke-linecap='round' stroke-linejoin='round'/><path d='M206 784C276 668 420 612 572 618C626 620 638 650 612 670C510 716 384 764 302 818C288 830 276 841 266 850L222 806Z'/></svg>")
          0 0 / 100% 100% no-repeat;
      }
      #splash .shine::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 55%;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.38) 50%, rgba(255, 255, 255, 0) 100%);
        transform: translate3d(-120%, 0, 0);
        will-change: transform;
        animation: splash-shine 3s cubic-bezier(0.45, 0, 0.2, 1) 500ms infinite;
      }
      /* Barre de progression réelle : avance à chaque étape de préchargement terminée. */
      #splash .bar {
        width: 168px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.07);
      }
      #splash-progress {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #3566c9, #8db4f5);
        transform-origin: left center;
        transform: scaleX(0.04);
        transition: transform 520ms cubic-bezier(0.2, 0, 0, 1);
        will-change: transform;
      }
      @keyframes splash-shine {
        0% {
          transform: translate3d(-120%, 0, 0);
        }
        60%,
        100% {
          transform: translate3d(220%, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .shine::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Aether">
      <div class="wrap">
        <div class="logo">
          <svg viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <linearGradient id="sa" x1="512" y1="170" x2="512" y2="880" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#6E9DEB" />
                <stop offset="1" stop-color="#2F5FC4" />
              </linearGradient>
              <linearGradient id="sb" x1="250" y1="620" x2="600" y2="860" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#3D6ED2" />
                <stop offset="1" stop-color="#2853B2" />
              </linearGradient>
            </defs>
            <path
              d="M222 806L512 236L802 806"
              fill="none"
              stroke="url(#sa)"
              stroke-width="124"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              fill="url(#sb)"
              d="M206 784C276 668 420 612 572 618C626 620 638 650 612 670C510 716 384 764 302 818C288 830 276 841 266 850L222 806Z"
            />
          </svg>
          <div class="shine"></div>
        </div>
        <div class="bar"><span id="splash-progress"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
